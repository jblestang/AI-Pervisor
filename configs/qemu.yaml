schema_version: 1

platform:
  name: qemu-validation
  requirements:
    arch: x86_64
    vmx: required
    ept: required
    vtd: required
    min_physical_cores: 3
    min_ram_gib: 4
    smt_policy: exclusive_core
    interrupt_remapping: required
    x2apic: preferred
    invariant_tsc: preferred
    vpid: preferred
    vmx_preemption_timer: preferred
    nx: required
    page_sizes:
      - 4096
      - 2097152

security:
  require_mid_in_datapath: true

qemu:
  machine: q35
  cpus: 4
  memory_mib: 8192
  cpu_model: qemu64
  accel: tcg
  smp_sockets: 1
  smp_cores: 4
  smp_threads: 1
  network:
    enabled: true
    backend: user
    interfaces:
      - partition: in
        bdf: "0000:00:03.0"
        pci_addr: "0x3"
        netdev_id: net_in
      - partition: out
        bdf: "0000:00:04.0"
        pci_addr: "0x4"
        netdev_id: net_out

partitions:
  - id: in
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [0]
    devices:
      - kind: nic_e1000
        bdf: "0000:00:03.0"
        role: datapath_in

  - id: mid
    vcpus: 1
    memory_gib: 2
    cpu_affinity:
      physical_cores: [1]
    devices: []

  - id: out
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [2]
    devices:
      - kind: nic_e1000
        bdf: "0000:00:04.0"
        role: datapath_out

ipc_channels:
  - id: chan_a
    producer: in
    consumer: mid
    queue_slots: 4096
    slot_size_bytes: 2048

  - id: chan_b
    producer: mid
    consumer: out
    queue_slots: 4096
    slot_size_bytes: 2048

boot:
  guest_images:
    - partition: in
      path: guests/guest-in/build/guest-in.elf
      sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    - partition: mid
      path: guests/guest-mid/build/guest-mid.elf
      sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    - partition: out
      path: guests/guest-out/build/guest-out.elf
      sha256: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
