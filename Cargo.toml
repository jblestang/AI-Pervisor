[workspace]
resolver = "2"
members = [
    "crates/hv-types",
    "crates/hv-config-model",
    "crates/hv-boot-abi",
    "crates/hv-guest-abi",
    "tools/hv-config",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
hv-types = { path = "crates/hv-types" }
hv-config-model = { path = "crates/hv-config-model" }
hv-boot-abi = { path = "crates/hv-boot-abi" }
hv-guest-abi = { path = "crates/hv-guest-abi" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
serde_yaml = "0.9.34"
sha2 = "0.10.8"
hex = "0.4.3"
proptest = "1.6.0"
thiserror = "2.0.11"
clap = { version = "4.5.28", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
lint_groups_priority = "allow"
manual_unwrap_or = "allow"

[profile.release]
lto = true
codegen-units = 1
