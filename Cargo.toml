[workspace]
resolver = "2"
members = [
    "crates/hv-types",
    "crates/hv-config-model",
    "crates/hv-platform-model",
    "crates/hv-boot-abi",
    "crates/hv-acpi-walk",
    "crates/hv-observation-types",
    "crates/hv-guest-abi",
    "crates/hv-loader",
    "crates/hv-loader-efi",
    "crates/hv-hypervisor-efi",
    "crates/hv-hypervisor",
    "crates/hv-hypervisor-boot",
    "crates/hv-vmx",
    "crates/hv-ept",
    "crates/hv-vtd",
    "crates/hv-x86-cpu",
    "tools/hv-config",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
hv-types = { path = "crates/hv-types" }
hv-config-model = { path = "crates/hv-config-model", default-features = true }
hv-platform-model = { path = "crates/hv-platform-model", default-features = true }
hv-boot-abi = { path = "crates/hv-boot-abi" }
hv-acpi-walk = { path = "crates/hv-acpi-walk" }
hv-observation-types = { path = "crates/hv-observation-types" }
hv-loader = { path = "crates/hv-loader" }
hv-loader-efi = { path = "crates/hv-loader-efi" }
hv-hypervisor-efi = { path = "crates/hv-hypervisor-efi" }
hv-hypervisor = { path = "crates/hv-hypervisor" }
hv-hypervisor-boot = { path = "crates/hv-hypervisor-boot", default-features = true }
hv-vmx = { path = "crates/hv-vmx" }
hv-ept = { path = "crates/hv-ept" }
hv-vtd = { path = "crates/hv-vtd" }
hv-x86-cpu = { path = "crates/hv-x86-cpu" }
hv-guest-abi = { path = "crates/hv-guest-abi" }
serde = { version = "1.0.217", default-features = false, features = ["derive"] }
serde_json = "1.0.138"
serde_yaml = "0.9.34"
sha2 = { version = "0.10.8", default-features = false }
hex = "0.4.3"
proptest = "1.6.0"
thiserror = { version = "2.0.11", default-features = false }
clap = { version = "4.5.28", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
lint_groups_priority = "allow"
manual_unwrap_or = "allow"

[profile.release]
lto = true
codegen-units = 1
