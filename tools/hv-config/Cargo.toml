[package]
name = "hv-config"
description = "Configuration compiler CLI for the static hypervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "hv_config"
path = "src/lib.rs"

[[bin]]
name = "hv-config"
path = "src/main.rs"
test = false

[lints]
workspace = true

[dependencies]
hv-config-model = { workspace = true }
hv-platform-model = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "cli"
path = "tests/cli.rs"
harness = true

[[test]]
name = "dispatch"
path = "tests/dispatch.rs"
harness = true
