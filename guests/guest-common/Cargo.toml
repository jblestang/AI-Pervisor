[package]
name = "guest-common"
description = "Shared no_std datapath guest runtime for in/mid/out partitions"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hv-guest-abi = { workspace = true }
hv-types = { workspace = true }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
