[package]
name = "hv-hypervisor-efi-bin"
description = "UEFI hypervisor application binary for Gate B transfer verification"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
hv-boot-abi = { path = "../hv-boot-abi" }
hv-hypervisor-efi = { path = "../hv-hypervisor-efi", default-features = false }
hv-types = { path = "../hv-types" }
log = { version = "0.4", default-features = false }
uefi = { version = "0.31", features = ["global_allocator", "logger", "panic_handler"] }

[features]
default = []
real-hw-execution = ["hv-hypervisor-efi/real-hw-execution"]
vmx-launch = ["hv-hypervisor-efi/vmx-launch"]
datapath-foundation = ["hv-hypervisor-efi/datapath-foundation"]
datapath-live = ["hv-hypervisor-efi/datapath-live"]
datapath-malicious = ["hv-hypervisor-efi/datapath-malicious"]
datapath-guests = ["hv-hypervisor-efi/datapath-guests"]
datapath-benchmark = ["hv-hypervisor-efi/datapath-benchmark"]
datapath-runtime = ["hv-hypervisor-efi/datapath-runtime"]
datapath-guest-sources = ["hv-hypervisor-efi/datapath-guest-sources"]
datapath-guest-live = ["hv-hypervisor-efi/datapath-guest-live"]
datapath-guest-execution = ["hv-hypervisor-efi/datapath-guest-execution"]
datapath-guest-throughput = ["hv-hypervisor-efi/datapath-guest-throughput"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[[bin]]
name = "hv-hypervisor"
path = "src/main.rs"
test = false
bench = false
