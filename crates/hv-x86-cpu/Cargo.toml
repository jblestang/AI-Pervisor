[package]
name = "hv-x86-cpu"
description = "x86 CPU instruction seams for Gate C hardware bring-up (host-only)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
execute-instructions = []
std = []
firmware-live-execution = ["execute-instructions"]
vmx-launch = ["execute-instructions"]
datapath-live = ["execute-instructions", "vmx-launch"]
datapath-guests = ["vmx-launch", "dep:hv-guest-boot"]
datapath-runtime = ["datapath-guests", "datapath-live"]
datapath-guest-live = ["datapath-guests"]

[dependencies]
hv-ept = { path = "../hv-ept" }
hv-guest-boot = { path = "../hv-guest-boot", optional = true }
hv-types = { workspace = true }
hv-vmx = { path = "../hv-vmx" }
hv-vtd = { path = "../hv-vtd" }

[dev-dependencies]
hv-config-model = { workspace = true, features = ["std"] }
hv-ept = { workspace = true }
hv-platform-model = { workspace = true, features = ["std"] }
hv-vmx = { workspace = true }
hv-vtd = { workspace = true }
hv-guest-boot = { workspace = true }

[[test]]
name = "vmx_launch"
path = "tests/vmx_launch.rs"
required-features = ["execute-instructions", "std", "vmx-launch"]

[[test]]
name = "live_instructions"
path = "tests/live_instructions.rs"
required-features = ["execute-instructions", "std"]
