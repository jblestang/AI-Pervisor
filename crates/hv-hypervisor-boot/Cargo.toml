[package]
name = "hv-hypervisor-boot"
description = "Portable Gate B boot validation and VMX init orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["hv-config-model/std", "hv-platform-model/std"]
cpu-seams = ["dep:hv-x86-cpu"]
live-execution = ["cpu-seams", "hv-x86-cpu/execute-instructions", "hv-x86-cpu/std"]
real-hw-execution = ["live-execution", "hv-x86-cpu/firmware-live-execution"]
vmx-launch = ["real-hw-execution", "dep:hv-guest-boot", "hv-vmx/launch", "hv-x86-cpu/vmx-launch"]
datapath-foundation = ["vmx-launch", "dep:hv-datapath"]

[dependencies]
hv-boot-abi = { path = "../hv-boot-abi" }
hv-config-model = { path = "../hv-config-model", default-features = false, features = [] }
hv-ept = { path = "../hv-ept", default-features = false, features = [] }
hv-guest-boot = { path = "../hv-guest-boot", optional = true }
hv-datapath = { path = "../hv-datapath", optional = true }
hv-observation-types = { path = "../hv-observation-types" }
hv-platform-model = { path = "../hv-platform-model", default-features = false, features = [] }
hv-types = { path = "../hv-types" }
hv-vtd = { path = "../hv-vtd", default-features = false, features = [] }
hv-vmx = { path = "../hv-vmx", default-features = false, features = [] }
hv-x86-cpu = { path = "../hv-x86-cpu", optional = true }

[dev-dependencies]
hv-config-model = { workspace = true, features = ["std"] }
hv-guest-abi = { workspace = true }
hv-loader = { workspace = true }
hv-platform-model = { workspace = true, features = ["std"] }
hv-ept = { workspace = true }
hv-vtd = { workspace = true }
hv-vmx = { workspace = true }
hv-x86-cpu = { workspace = true }

[[test]]
name = "cpu_seams"
path = "tests/cpu_seams.rs"
required-features = ["cpu-seams"]

[[test]]
name = "live_execution"
path = "tests/live_execution.rs"
required-features = ["live-execution"]

[[test]]
name = "real_hw_execution"
path = "tests/real_hw_execution.rs"
required-features = ["real-hw-execution"]

[[test]]
name = "vmx_launch"
path = "tests/vmx_launch.rs"
required-features = ["vmx-launch"]

[[test]]
name = "datapath_foundation"
path = "tests/datapath_foundation.rs"
required-features = ["datapath-foundation"]
