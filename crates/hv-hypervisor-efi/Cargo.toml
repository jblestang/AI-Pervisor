[package]
name = "hv-hypervisor-efi"
description = "Portable UEFI hypervisor transfer verification entry for Gate B"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
real-hw-execution = ["hv-hypervisor-boot/real-hw-execution", "dep:uefi", "dep:hv-x86-cpu"]
vmx-launch = ["real-hw-execution", "hv-hypervisor-boot/vmx-launch"]
datapath-foundation = ["vmx-launch", "hv-hypervisor-boot/datapath-foundation"]
datapath-live = ["datapath-foundation", "hv-hypervisor-boot/datapath-live"]
datapath-malicious = ["datapath-live", "hv-hypervisor-boot/datapath-malicious"]
datapath-guests = ["datapath-malicious", "hv-hypervisor-boot/datapath-guests"]
datapath-benchmark = ["datapath-guests", "hv-hypervisor-boot/datapath-benchmark"]
datapath-runtime = ["datapath-benchmark", "hv-hypervisor-boot/datapath-runtime"]
datapath-guest-sources = ["datapath-runtime", "hv-hypervisor-boot/datapath-guest-sources"]
datapath-guest-live = ["datapath-guest-sources", "hv-hypervisor-boot/datapath-guest-live"]
datapath-guest-execution = ["datapath-guest-live", "hv-hypervisor-boot/datapath-guest-execution", "dep:hv-datapath"]

[dependencies]
hv-boot-abi = { path = "../hv-boot-abi" }
hv-guest-boot = { path = "../hv-guest-boot" }
hv-hypervisor-boot = { path = "../hv-hypervisor-boot", default-features = false, features = [] }
hv-datapath = { path = "../hv-datapath", optional = true }
hv-types = { path = "../hv-types" }
hv-x86-cpu = { path = "../hv-x86-cpu", optional = true }
uefi = { version = "0.31", optional = true }

[dev-dependencies]
hv-config-model = { workspace = true }
hv-datapath = { workspace = true }
hv-hypervisor = { workspace = true }
hv-hypervisor-boot = { workspace = true }
hv-loader = { workspace = true }
hv-observation-types = { workspace = true }
hv-platform-model = { workspace = true }
hv-x86-cpu = { workspace = true, features = ["execute-instructions", "std", "firmware-live-execution"] }

[[test]]
name = "vmx_launch"
path = "tests/vmx_launch.rs"
required-features = ["vmx-launch"]

[[test]]
name = "datapath_foundation"
path = "tests/datapath_foundation.rs"
required-features = ["datapath-foundation"]

[[test]]
name = "datapath_live"
path = "tests/datapath_live.rs"
required-features = ["datapath-live"]

[[test]]
name = "datapath_malicious"
path = "tests/datapath_malicious.rs"
required-features = ["datapath-malicious"]

[[test]]
name = "datapath_guests"
path = "tests/datapath_guests.rs"
required-features = ["datapath-guests"]

[[test]]
name = "datapath_benchmark"
path = "tests/datapath_benchmark.rs"
required-features = ["datapath-benchmark"]

[[test]]
name = "datapath_runtime"
path = "tests/datapath_runtime.rs"
required-features = ["datapath-runtime"]

[[test]]
name = "datapath_guest_sources"
path = "tests/datapath_guest_sources.rs"
required-features = ["datapath-guest-sources"]

[[test]]
name = "datapath_guest_live"
path = "tests/datapath_guest_live.rs"
required-features = ["datapath-guest-live"]

[[test]]
name = "datapath_guest_execution"
path = "tests/datapath_guest_execution.rs"
required-features = ["datapath-guest-execution"]

[[test]]
name = "real_hw"
path = "tests/real_hw.rs"
required-features = ["real-hw-execution"]
