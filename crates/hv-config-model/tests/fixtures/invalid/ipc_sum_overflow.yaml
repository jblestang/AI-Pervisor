schema_version: 1
platform:
  name: ipc-sum-overflow
  requirements:
    arch: x86_64
    vmx: required
    ept: required
    vtd: required
    min_physical_cores: 3
    min_ram_gib: 1
    smt_policy: exclusive_core
    interrupt_remapping: required
    x2apic: preferred
    invariant_tsc: preferred
    vpid: preferred
    vmx_preemption_timer: preferred
    nx: required
    page_sizes: [4096]
security:
  require_mid_in_datapath: false
qemu:
  machine: q35
  cpus: 3
  memory_mib: 1024
  cpu_model: qemu64
  accel: tcg
  smp_sockets: 1
  smp_cores: 3
  smp_threads: 1
partitions:
  - id: a
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [0]
    devices: []
  - id: b
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [1]
    devices: []
  - id: c
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [2]
    devices: []
ipc_channels:
  - id: big_a
    producer: a
    consumer: b
    queue_slots: 2200000000
    slot_size_bytes: 4294967295
  - id: big_b
    producer: b
    consumer: c
    queue_slots: 2200000000
    slot_size_bytes: 4294967295
boot:
  guest_images:
    - partition: a
      path: a.elf
      sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    - partition: b
      path: b.elf
      sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    - partition: c
      path: c.elf
      sha256: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
