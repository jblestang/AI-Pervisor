schema_version: 1
platform:
  name: minimal
  requirements:
    arch: x86_64
    vmx: required
    ept: required
    vtd: required
    min_physical_cores: 3
    min_ram_gib: 4
    smt_policy: exclusive_core
    interrupt_remapping: required
    x2apic: preferred
    invariant_tsc: preferred
    vpid: preferred
    vmx_preemption_timer: preferred
    nx: required
    page_sizes: [4096]
security:
  require_mid_in_datapath: true
qemu:
  machine: q35
  cpus: 3
  memory_mib: 1024
  cpu_model: qemu64
  accel: tcg
  smp_sockets: 1
  smp_cores: 3
  smp_threads: 1
partitions:
  - id: in
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [0]
    devices:
      - kind: nic_e1000
        mmio_guest_phys: "0xFEB00000"
        bdf: "0000:00:03.0"
        role: datapath_in
  - id: mid
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [1]
    devices: []
  - id: out
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [2]
    devices:
      - kind: nic_e1000
        mmio_guest_phys: "0xFEB20000"
        bdf: "0000:00:04.0"
        role: datapath_out
ipc_channels:
  - id: chan_direct
    producer: in
    consumer: out
    queue_slots: 4096
    slot_size_bytes: 2048
boot:
  guest_images:
    - partition: in
      path: in.elf
      sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    - partition: mid
      path: mid.elf
      sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    - partition: out
      path: out.elf
      sha256: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
