schema_version: 1
platform:
  name: minimal
  requirements:
    arch: x86_64
    vmx: required
    ept: required
    vtd: required
    min_physical_cores: 1
    min_ram_gib: 1
    smt_policy: exclusive_core
    interrupt_remapping: required
    x2apic: preferred
    invariant_tsc: preferred
    vpid: preferred
    vmx_preemption_timer: preferred
    nx: required
    page_sizes: [4096]
security:
  require_mid_in_datapath: false
qemu:
  machine: q35
  cpus: 1
  memory_mib: 1024
  cpu_model: qemu64
  accel: tcg
  smp_sockets: 1
  smp_cores: 1
  smp_threads: 1
  network:
    enabled: true
    backend: tap
    interfaces:
      - partition: a
        bdf: "0000:00:04.0"
        pci_addr: "0x4"
        netdev_id: net_in
        tap_ifname: hvdp-in0
partitions:
  - id: a
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [0]
    devices:
      - kind: nic_e1000
        bdf: "0000:00:03.0"
        mmio_guest_phys: "0xFEB00000"
ipc_channels: []
boot:
  guest_images:
    - partition: a
      path: a.elf
      sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
