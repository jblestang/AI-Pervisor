schema_version: 1
platform:
  name: gateway
  requirements:
    arch: x86_64
    vmx: required
    ept: required
    vtd: required
    min_physical_cores: 2
    min_ram_gib: 2
    smt_policy: exclusive_core
    interrupt_remapping: required
    x2apic: preferred
    invariant_tsc: preferred
    vpid: preferred
    vmx_preemption_timer: preferred
    nx: required
    page_sizes: [4096]
security:
  require_mid_in_datapath: true
qemu:
  machine: q35
  cpus: 2
  memory_mib: 2048
  cpu_model: qemu64
  accel: tcg
  smp_sockets: 1
  smp_cores: 2
  smp_threads: 1
partitions:
  - id: gateway
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [0]
    devices:
      - kind: nic_e1000
        mmio_guest_phys: "0xFEB00000"
        bdf: "0000:00:03.0"
        role: datapath_in
      - kind: nic_e1000
        mmio_guest_phys: "0xFEB20000"
        bdf: "0000:00:04.0"
        role: datapath_out
  - id: mid
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [1]
    devices: []
ipc_channels:
  - id: chan_a
    producer: gateway
    consumer: mid
    queue_slots: 64
    slot_size_bytes: 4096
boot:
  guest_images:
    - partition: gateway
      path: gw.elf
      sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    - partition: mid
      path: mid.elf
      sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
