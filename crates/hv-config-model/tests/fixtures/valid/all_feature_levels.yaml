schema_version: 1
platform:
  name: feature-matrix
  requirements:
    arch: x86_64
    vmx: disabled
    ept: optional
    vtd: preferred
    min_physical_cores: 1
    min_ram_gib: 1
    smt_policy: same_partition_siblings
    interrupt_remapping: required
    x2apic: preferred
    invariant_tsc: optional
    vpid: disabled
    vmx_preemption_timer: optional
    nx: required
    page_sizes: [4096, 4096]
security:
  require_mid_in_datapath: false
qemu:
  machine: q35
  cpus: 1
  memory_mib: 1024
  cpu_model: qemu64
  accel: tcg
  smp_sockets: 1
  smp_cores: 1
  smp_threads: 1
partitions:
  - id: a
    vcpus: 1
    memory_gib: 1
    cpu_affinity:
      physical_cores: [0]
    devices:
      - kind: nic_e1000
        mmio_guest_phys: "0xFEB20000"
        bdf: "0000:00:04.0"
      - kind: nic_e1000
        mmio_guest_phys: "0xFEB00000"
        bdf: "0000:00:03.0"
ipc_channels: []
boot:
  guest_images:
    - partition: a
      path: a.elf
      sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
