[package]
name = "hv-loader-efi"
description = "Portable UEFI loader entry logic shared by the firmware binary and host tests"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = ["hv-loader/std"]

[dependencies]
hv-acpi-walk = { workspace = true }
hv-loader = { workspace = true }
hv-observation-types = { workspace = true }
hv-types = { workspace = true }

[dev-dependencies]
hv-boot-abi = { workspace = true }
hv-config-model = { workspace = true }
hv-loader = { workspace = true, features = ["std"] }
