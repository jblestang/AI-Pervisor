[package]
name = "xtask"
description = "Developer task runner for the static hypervisor workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
hv-config = { path = "../tools/hv-config", package = "hv-config" }
hv-boot-abi = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
[[test]]
name = "cli"
path = "tests/cli.rs"
harness = true
