[package]
name = "ai-pervisor-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
hv-acpi-walk = { path = "../crates/hv-acpi-walk" }
hv-boot-abi = { path = "../crates/hv-boot-abi" }
hv-config-model = { path = "../crates/hv-config-model" }
