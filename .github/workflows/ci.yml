name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: coverage
        run: cargo xtask coverage
      - name: validate config
        run: cargo xtask config validate configs/qemu.yaml
      - name: build
        run: cargo xtask build
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - name: install libfuzzer build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential g++-14 libstdc++-14-dev
      - name: fuzz smoke
        run: cargo xtask fuzz
